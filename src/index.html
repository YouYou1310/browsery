<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browsery</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="toolbar">
    <button id="back" class="icon" title="戻る">←</button>
    <button id="forward" class="icon" title="進む">→</button>
    <button id="reload" class="icon" title="再読み込み">↻</button>
    <form id="address-form" class="address-wrap">
      <input id="address" autocomplete="off" spellcheck="false" placeholder="URL または検索語を入力" />
    </form>
    <button id="home" class="icon" title="ホーム">⌂</button>
  </header>

  <main class="browser-area">
    <webview id="view" src="https://www.google.com" allowpopups></webview>
    <section id="welcome" class="welcome" hidden>
      <div class="logo">B</div>
      <h1>Browsery</h1>
      <p>軽く、シンプルに、ウェブへ。</p>
      <form id="welcome-form" class="welcome-search">
        <input id="welcome-input" placeholder="URL または検索語" />
        <button>検索</button>
      </form>
    </section>
  </main>

  <footer class="status"><span id="status-text">準備完了</span></footer>
  <script src="./renderer.js"></script>
</body>
</html>
